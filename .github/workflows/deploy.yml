# Test deploy: builds the site for GitHub Pages (edcarlosramos.github.io/websitesmarianaxisto/)
# on every push to these branches, or by hand from the Actions tab ("Run workflow").
# The Hostinger build (npm run build) is unaffected.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, desafio-black-mariana]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
